<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine?</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{
    height:100vh;
    overflow:hidden;
    background: linear-gradient(135deg,#ffd1dc,#ff4f81);
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:#fff;
}
.container{z-index:5;padding:20px;max-width:90%;}
.bear{font-size:4rem;animation:bounce 1.5s infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-15px);}}

.heroPhoto{
    width:300px;
    max-width:92%;
    border-radius:22px;
    margin:25px 0;
    object-fit:cover;
    box-shadow:0 20px 60px rgba(0,0,0,0.35),
               0 0 40px rgba(255,105,180,0.25);
    filter:brightness(1.08) contrast(1.08) saturate(1.05);
    animation:cinematicFloat 6s ease-in-out infinite alternate;
}
@keyframes cinematicFloat{from{transform:scale(1);}to{transform:scale(1.06);}}

h1{font-family:'Dancing Script',cursive;font-size:2.7rem;text-shadow:0 5px 20px rgba(0,0,0,0.4);}
.subtitle{font-style:italic;margin-top:10px;margin-bottom:20px;}

.buttons{margin-top:25px;display:flex;justify-content:center;gap:40px;}

#yesBtn{
    padding:15px 40px;
    font-size:1.2rem;
    border:none;
    border-radius:50px;
    background:linear-gradient(45deg,#ff0000,#ff4d4d);
    color:white;
    cursor:pointer;
    box-shadow:0 0 15px rgba(255,0,0,0.8);
    transition:0.3s;
}
#yesBtn:hover{transform:scale(1.08);box-shadow:0 0 25px rgba(255,0,0,1);}

#noBtn{
    padding:10px 25px;
    border-radius:50px;
    border:2px solid red;
    background:white;
    color:red;
    cursor:pointer;
}

.heart{position:fixed;bottom:-20px;animation:floatUp linear infinite;pointer-events:none;}
@keyframes floatUp{
    0%{transform:translateY(0);opacity:0;}
    10%{opacity:1;}
    100%{transform:translateY(-110vh);opacity:0;}
}

.yesOverlay{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,0.5);
    backdrop-filter:blur(8px);
    z-index:20;
}
.yesMoment{
    position:fixed;top:50%;left:50%;
    transform:translate(-50%,-50%) scale(0.95);
    width:320px;max-width:92%;
    border-radius:20px;
    box-shadow:0 25px 70px rgba(0,0,0,0.5);
    z-index:25;
    animation:yesReveal 3s ease forwards;
}
@keyframes yesReveal{
    0%{opacity:0;transform:translate(-50%,-50%) scale(0.95);}
    50%{opacity:1;}
    100%{transform:translate(-50%,-50%) scale(1.05);}
}

.celebration{
    position:fixed;top:0;left:0;width:100%;height:100%;
    backdrop-filter:blur(15px);
    background:rgba(255,105,180,0.4);
    display:flex;flex-direction:column;
    justify-content:center;align-items:center;
    z-index:22;
    animation:cinematicZoom 6s ease forwards;
}
@keyframes cinematicZoom{from{transform:scale(1);}to{transform:scale(1.08);}}

.bigText{
    font-size:2rem;font-weight:bold;
    text-shadow:0 10px 40px rgba(255,255,255,0.8);
}

.polaroid{
    position:fixed;bottom:40px;width:180px;
    padding:12px 12px 35px 12px;
    background:white;border-radius:12px;
    box-shadow:0 20px 40px rgba(0,0,0,0.35);
    z-index:30;
}
.polaroid img{width:100%;border-radius:8px;}

#photo3{left:8%;transform:rotate(-7deg);animation:floatLeft 5s ease-in-out infinite;}
#photo4{right:8%;transform:rotate(9deg);animation:floatRight 5s ease-in-out infinite;}

@keyframes floatLeft{
    0%{transform:rotate(-7deg) translateY(0);}
    50%{transform:rotate(-4deg) translateY(-12px);}
    100%{transform:rotate(-7deg) translateY(0);}
}
@keyframes floatRight{
    0%{transform:rotate(9deg) translateY(0);}
    50%{transform:rotate(6deg) translateY(-12px);}
    100%{transform:rotate(9deg) translateY(0);}
}

.confetti{
    position:fixed;width:10px;height:10px;top:-10px;
    animation:confettiFall linear forwards;
}
@keyframes confettiFall{
    to{transform:translateY(110vh) rotate(720deg);opacity:0;}
}
</style>
</head>

<body>

<div class="container" id="mainContent">
    <div class="bear">🐻</div>

    <img src="./photo1.jpg" class="heroPhoto">

    <h1>Will You Be My Valentine?</h1>

    <p class="subtitle">
    I've been gathering courage to ask you this because you get me nervous in ways I've never felt before and this is a bold step from me..very new to this game
    </p>

    <div class="buttons">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
    </div>
</div>

<script>

setInterval(()=>{
    const heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤️";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(15+Math.random()*30)+"px";
    heart.style.animationDuration=(5+Math.random()*5)+"s";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),10000);
},500);

const noBtn=document.getElementById("noBtn");
const yesBtn=document.getElementById("yesBtn");

function moveNo(){
    noBtn.style.position="fixed";
    noBtn.style.left=Math.random()*(window.innerWidth-100)+"px";
    noBtn.style.top=Math.random()*(window.innerHeight-50)+"px";
}
noBtn.addEventListener("mouseover",moveNo);
noBtn.addEventListener("click",moveNo);
noBtn.addEventListener("touchstart",moveNo);

yesBtn.addEventListener("click",()=>{

document.getElementById("mainContent").style.display="none";

const overlay=document.createElement("div");
overlay.className="yesOverlay";
document.body.appendChild(overlay);

const yesPhoto=document.createElement("img");
yesPhoto.src="./photo2.jpg";
yesPhoto.className="yesMoment";
document.body.appendChild(yesPhoto);

setTimeout(()=>{
overlay.remove();
yesPhoto.remove();

const celebration=document.createElement("div");
celebration.className="celebration";
celebration.innerHTML=`
<div class="bigText">
Every love story is beautiful…<br><br>
but ours, as we've always talked about,<br>
is gonna be the best out of them all.<br><br>
Us together is the most special<br>
and precious gift I could ever ask for ❤️
</div>
`;
document.body.appendChild(celebration);

const p3=document.createElement("div");
p3.className="polaroid";
p3.id="photo3";
p3.innerHTML=\`<img src="./photo3.jpg">\`;
document.body.appendChild(p3);

const p4=document.createElement("div");
p4.className="polaroid";
p4.id="photo4";
p4.innerHTML=\`<img src="./photo4.jpg">\`;
document.body.appendChild(p4);

for(let i=0;i<120;i++){
const conf=document.createElement("div");
conf.className="confetti";
conf.style.left=Math.random()*100+"vw";
conf.style.backgroundColor=\`hsl(\${Math.random()*360},100%,50%)\`;
conf.style.animationDuration=(2+Math.random()*3)+"s";
document.body.appendChild(conf);
setTimeout(()=>conf.remove(),5000);
}

},3000);

});
</script>

</body>
</html>
